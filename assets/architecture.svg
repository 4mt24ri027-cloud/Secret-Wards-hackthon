<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="920" height="110" role="img" aria-label="Secret Wards architecture: Hospital files to Find identifying details to Link records for the same patient to Clean each record to Cleaned files, report and record index">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <style>
      .box { fill: #161b22; stroke: #444c56; stroke-width: 1.5; rx: 6; ry: 6; }
      .lbl { fill: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .edge { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="10" y="25" width="130" height="60" rx="6"/>
  <text class="lbl" x="75" y="55">Hospital files</text>

  <line class="edge" x1="140" y1="55" x2="174" y2="55"/>

  <rect class="box" x="176" y="20" width="150" height="70" rx="6"/>
  <text class="lbl" x="251" y="46">Find identifying</text>
  <text class="lbl" x="251" y="64">details</text>

  <line class="edge" x1="326" y1="55" x2="360" y2="55"/>

  <rect class="box" x="362" y="15" width="164" height="80" rx="6"/>
  <text class="lbl" x="444" y="38">Link records for</text>
  <text class="lbl" x="444" y="55">the same</text>
  <text class="lbl" x="444" y="72">patient</text>

  <line class="edge" x1="526" y1="55" x2="560" y2="55"/>

  <rect class="box" x="562" y="20" width="136" height="70" rx="6"/>
  <text class="lbl" x="630" y="46">Clean each</text>
  <text class="lbl" x="630" y="64">record</text>

  <line class="edge" x1="698" y1="55" x2="732" y2="55"/>

  <rect class="box" x="734" y="15" width="176" height="80" rx="6"/>
  <text class="lbl" x="822" y="38">Cleaned files,</text>
  <text class="lbl" x="822" y="55">report and</text>
  <text class="lbl" x="822" y="72">record index</text>
</svg>
